# This workflow will upload a Python Package using Twine when a release is created

name: Upload Snap

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version/tag to publish (e.g., v1.2.3). If not specified, publishes the latest release.'
        required: false
        type: string

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r sec_vault/requirements/test.txt
    - name: Install snapcraft
      run: |
        sudo snap install snapcraft --classic
    - name: Configure Snapcraft credentials
      env:
        SNAP_MACAROON: ${{ secrets.SNAP_MACAROON }}
        SNAP_UNBOUND_DISCHARGE: ${{ secrets.SNAP_UNBOUND_DISCHARGE }}
        SNAP_EMAIL: ${{ secrets.SNAP_EMAIL }}
      run: |
        # Create credentials JSON for new snapcraft authentication (SNAPCRAFT_STORE_CREDENTIALS)
        cat << EOF > snapcraft-credentials.json
        {
          "macaroon": "$SNAP_MACAROON",
          "discharge": "$SNAP_UNBOUND_DISCHARGE",
          "email": "$SNAP_EMAIL"
        }
        EOF
        # Persist credentials for subsequent steps
        echo "SNAPCRAFT_STORE_CREDENTIALS=$(cat snapcraft-credentials.json | jq -c .)" >> $GITHUB_ENV
    - name: Build and publish
      run: |
        snapcraft
        SNAP=$(ls sec-vault_*.snap | head -1)
        snapcraft upload --release=edge "$SNAP"
