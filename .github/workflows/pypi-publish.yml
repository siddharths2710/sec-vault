# This workflow will upload a Python Package using Twine when a release is created

name: Upload Python Package

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version/tag to publish (e.g., v1.2.3). If not specified, publishes the latest release.'
        required: false
        type: string

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r sec_vault/requirements/test.txt
        pip install twine setuptools wheel
    - name: Build and publish
      env:
        TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      run: |
         export TWINE_USERNAME=$TWINE_USERNAME
         export TWINE_PASSWORD=$TWINE_PASSWORD
         python setup.py sdist bdist_wheel
         twine upload dist/*
         unset TWINE_USERNAME
         unset TWINE_PASSWORD
